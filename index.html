<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7a0019"><title>SBU Crew Coach</title><style>:root{--m:#7a0019;--bg:#f3f4f6;--tx:#17202a;--mu:#6b7280;--g:#146c43;--r:#a61b29;--a:#9a6700}*{box-sizing:border-box}body{margin:0;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);padding-bottom:76px}header{background:#fff;border-bottom:1px solid #ddd;padding:14px 16px;display:flex;gap:11px;align-items:center}.logo{width:44px;height:44px;border-radius:11px;background:var(--m);color:#fff;display:grid;place-items:center;font-weight:800}h1{font-size:18px;margin:0}.sub{font-size:14px;color:var(--mu)}main{max-width:700px;margin:auto;padding:10px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:0 1px 2px #0001}.weather{color:#fff;background:var(--a)}.weather.go{background:var(--g)}.weather.land{background:var(--r)}.ey{font-size:12px;letter-spacing:.06em;font-weight:800;opacity:.82}.status{font-size:28px;font-weight:850;margin:5px 0 12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.metric{background:#fff2;border-radius:10px;padding:8px 4px;text-align:center}.metric b{display:block;font-size:18px}.metric span{font-size:10px}.refresh{float:right;border:0;background:#fff2;color:#fff;border-radius:99px;width:36px;height:36px;font-size:18px}.title{font-size:25px;font-weight:850;margin:6px 0}.pill,.chip{display:inline-block;border-radius:99px;padding:7px 9px;font-size:12px;font-weight:750}.pill{background:#f0f1f3;color:#374151}.chip{background:#f8e8ed;color:var(--m)}.section{border-top:1px solid #eee;padding-top:12px;margin-top:12px}.section h3{font-size:12px;color:var(--mu);letter-spacing:.06em;margin:0 0 5px}.section p{font-size:16px;line-height:1.38;margin:0}.chips{display:flex;flex-wrap:wrap;gap:6px}.notice{font-size:12px;margin-top:9px}.split{display:grid;gap:8px;margin-top:13px}.track{padding:12px;border:1px solid #ddd;border-radius:12px;background:#fafafa}.track strong{font-size:12px;color:var(--m)}.track p{font-size:15px;line-height:1.38;margin:5px 0 0}.more{font-size:13px;font-weight:800;color:var(--mu)}.hidden{display:none}.week{border-left:4px solid #ddd}.week h2{font-size:18px;margin:4px 0}.date{font-size:13px;color:var(--mu)}.event{font-size:14px;font-weight:700;color:var(--m);margin:6px 0}.planrow{padding:12px 0;border-top:1px solid #eee}.planrow b{font-size:15px}.planrow small{display:block;color:var(--mu);margin-top:3px}details summary{cursor:pointer;list-style:none}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}nav button{width:25%;max-width:180px;border:0;background:#fff;padding:9px 3px;color:var(--mu);font-size:13px}nav button.active{color:var(--m);font-weight:800}nav b{display:block;font-size:19px}@media(max-width:420px){.metrics{grid-template-columns:repeat(2,1fr)}}header{position:relative}#editBtn{margin-left:auto;border:0;background:var(--m);color:#fff;border-radius:99px;width:38px;height:38px;font-size:21px}</style></head><body><header><div class="logo">SBU</div><div><h1>CREW COACH</h1><div class="sub">Port Jefferson Harbor · Fall 2026</div></div><button id="editBtn" aria-label="Edit today">✎</button></header><main><section id="today"></section><section id="season" class="hidden"></section><section id="plan" class="hidden"></section><section id="library" class="hidden"></section></main><nav><button class="active" data-tab="today"><b>☁</b>Today</button><button data-tab="season"><b>▣</b>Season</button><button data-tab="plan"><b>☷</b>Plan</button><button data-tab="library"><b>▤</b>Library</button></nav><script>const PH=[['2026-09-01','2026-09-04','Indoor Foundation I','Learn the stroke'],['2026-09-07','2026-09-11','Indoor Foundation II','Build rhythm'],['2026-09-14','2026-09-18','Benchmark / Boat Prep','Establish baseline'],['2026-09-21','2026-09-25','Water Introduction','Make the boat stable'],['2026-09-28','2026-10-03','Crew Formation','Row together'],['2026-10-05','2026-10-09','Head Racing I','Hold speed'],['2026-10-12','2026-10-16','Head Racing II','Race the boat'],['2026-10-19','2026-10-24','Head of the Fish Peak','Execute 4K'],['2026-10-26','2026-10-30','2K Conversion','Same stroke, less time'],['2026-11-02','2026-11-08','Championship Week','Trust the plan'],['2026-11-09','2026-11-12','Season Close','Finish together']];const EVENTS={'2026-09-17':'2K #1','2026-09-18':'Rigging','2026-09-21':'Commands & Safety','2026-09-22':'First Water','2026-10-03':'Alumni Day','2026-10-23':'Trailer Load','2026-10-24':'Head of the Fish','2026-10-26':'Unload / Recovery','2026-10-29':'2K #2','2026-11-06':'Trailer Load','2026-11-07':'Frostbite','2026-11-08':'Braxton','2026-11-09':'Unload / Recovery','2026-11-12':'Final Practice'};const SPECIAL={'2026-09-01':{lesson:'Rowing 101 / Varsity Circuit',novice:'Erg setup, posture, legs-body-arms / arms-body-legs. Short coached reps.',varsity:'25 min steady erg @ 18–20 + 25 min bodyweight/core. Rotate groups if needed.',focus:'Novices learn sequence. Varsity begins aerobic work.',cues:['Sequence first','Long strokes','Learn the routine'],success:'Novices show the basic sequence; varsity completes quality work.',intensity:'Novice RPE 3–4 · Varsity RPE 5–6'},'2026-09-02':{lesson:'Recovery Order / Varsity Circuit',novice:'Hands away → body over → slide. Pause at body-over; short 18 spm pieces.',varsity:'3 × 8 min @ 18–20, 2 min easy + 25 min bodyweight/core.',focus:'Novices learn recovery order. Varsity builds volume.',cues:['Hands first','Body before knees','Patient slide'],success:'Novices recover in order; varsity holds rate and split.',intensity:'Novice RPE 3–4 · Varsity RPE 5–6'},'2026-09-03':{lesson:'Connection / Varsity Circuit',novice:'Full stroke review, legs-first connection, then 3 × 5 min @ 18 / 2 min easy.',varsity:'4 × 6 min @ 20, final 90 sec firm, 2 min easy + 25 min bodyweight/core.',focus:'Novices connect the drive. Varsity gets the hardest opening-day load.',cues:['Legs first','Do not rush','Hold form'],success:'Novices row continuously at low rate; varsity finishes clean.',intensity:'Novice RPE 4–5 · Varsity RPE 6–7'},'2026-09-04':{lesson:'Friday Team Day',workout:'Stadium steps or outdoor team challenge. No ergs.',focus:'Conditioning + team cohesion.',cues:['Move well','Compete together','Finish together'],success:'Finish energized, not buried.',intensity:'RPE 5–6'},'2026-09-17':{lesson:'2K #1',workout:'Standard warm-up, then 2K. Record each 500 split.',focus:'Establish an honest baseline.',cues:['Control first 500','Commit at 1000','Race final 750'],success:'Complete result + splits.',intensity:'Max benchmark'},'2026-09-18':{lesson:'Rigging Day',workout:'Rig boats. Teach parts, hardware, care and ownership.',focus:'Make the fleet ready.',cues:['Correct hardware','Work deliberately','Leave it better'],success:'Boats rigged correctly.',intensity:'Low'},'2026-09-21':{lesson:'Commands & Safety',workout:'Carrying, commands, launch sequence, stopping, turning and emergency basics.',focus:'Operate safely before rowing.',cues:['Listen first','Move together','Acknowledge'],success:'Core commands are understood.',intensity:'Low'},'2026-09-22':{lesson:'First Water Practice',workout:'Set work, arms/body sequencing, pause work, short rowing @ 16–18.',fallback:'3 × 12 min easy @ 18–20 with body-over pauses.',focus:'Make the boat stable.',cues:['Level hands','Patient recovery','Move together'],success:'Stable repeatable strokes.',intensity:'RPE 4–5'},'2026-10-03':{lesson:'Alumni Day',workout:'Light alumni/current-athlete rows; mixed lineups as appropriate.',focus:'Connect current athletes to team history.',cues:['Welcome people in','Row clean','Represent the team'],success:'Safe, enjoyable alumni event.',intensity:'Easy'},'2026-10-23':{lesson:'Trailer Loading',workout:'Load shells, oars, riggers and race gear. No practice.',focus:'Arrive prepared.',cues:['Checklist','Protect equipment','Nothing assumed'],success:'Trailer complete and organized.',intensity:'Low'},'2026-10-24':{lesson:'Head of the Fish',workout:'Race day. Standard warm-up, 4K race plan, cooldown.',focus:'Execute the 4K.',cues:['Settle early','Own the base','Finish through line'],success:'Crew stays on race plan.',intensity:'Race'},'2026-10-26':{lesson:'Unload & Reset',workout:'Unload, inspect equipment, 20–25 min easy mobility/walk.',focus:'Recover before rebuilding.',cues:['Reset','Notice lessons','No hero work'],success:'Fleet reset; athletes leave fresher.',intensity:'Recovery'},'2026-10-29':{lesson:'2K #2',workout:'Same warm-up as Sept. 17, then 2K. Record each 500 split.',focus:'Measure fall progress and set championship pace.',cues:['Race the plan','Hold the middle','Commit early'],success:'Comparable result + usable race pace.',intensity:'Max benchmark'},'2026-11-06':{lesson:'Championship Trailer Load',workout:'Trailer loading only. No training.',focus:'Organization, not fitness.',cues:['Checklist','Protect equipment','Stay calm'],success:'Nothing missing.',intensity:'Low'},'2026-11-07':{lesson:'Frostbite',workout:'Race day.',focus:'Execute the 2K plan.',cues:['Start-settle','Base rhythm','Attack third 500'],success:'Crew executes planned rhythm and moves.',intensity:'Race'},'2026-11-08':{lesson:'Braxton',workout:'Race day. Apply one or two lessons from Saturday.',focus:'Do it again, better.',cues:['One correction','Stay together','Finish empty'],success:'Better complete race than Saturday.',intensity:'Race'},'2026-11-09':{lesson:'Unload & Recover',workout:'Unload + mobility + short debrief.',focus:'Reset equipment and capture lessons.',cues:['Reset','Be specific','Recover'],success:'Equipment reset; lessons documented.',intensity:'Recovery'},'2026-11-12':{lesson:'Final Practice',workout:'Light technical/fun row if safe; otherwise easy movement + season review.',focus:'Close the fall intentionally.',cues:['Enjoy it','Notice progress','Leave it ready'],success:'Athletes know what improved and what comes next.',intensity:'Easy'}};const LIMITS={E:15,W:15,S:20,N:10,NE:10,NW:15,SE:15,SW:15};function phase(d){return PH.find(x=>d>=x[0]&&d<=x[1])||['','','Off','']}function localISO(){let p=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),o={};p.forEach(x=>o[x.type]=x.value);return `${o.year}-${o.month}-${o.day}`}function dir(x){return ['N','NE','E','SE','S','SW','W','NW'][Math.round(x/45)%8]}function generic(k,dow){let ph=phase(k),fri=dow===5,late=k>='2026-11-02',head=k>='2026-10-05'&&k<='2026-10-24',conv=k>='2026-10-27'&&k<='2026-10-29';if(fri)return{lesson:'Friday Team Day',workout:'Stadium steps, outdoor conditioning, scavenger hunt or recovery. No ergs.',focus:'Team conditioning + cohesion.',cues:['Move well','Compete together','Finish together'],success:'Good work without carrying fatigue.',intensity:'RPE 5–7'};if(late)return{lesson:'Championship Sharpening',workout:'Starts + short race-rate pieces with full recovery. Declining volume.',fallback:'Short race-rate erg intervals with full recovery.',focus:'Keep speed; lose fatigue.',cues:['Trust speed','Relax','Finish clean'],success:'Fast work stays technically clean.',intensity:'Race pace · low volume'};if(conv)return{lesson:'2K Conversion',workout:'Starts + 500m-equivalent pieces at 2K rhythm; generous recovery.',fallback:'6 × 500m @ 2K pace, 2:30–3:00 easy.',focus:'Same stroke, less time.',cues:['Fast hands','Connected legs','Do not shorten'],success:'Rate rises without losing length.',intensity:'RPE 8'};if(head)return{lesson:ph[3],workout:'3 × 12 min @ 20–24 with race-rhythm segments and controlled moves.',fallback:'3 × 12 min erg @ 20–24; middle 4 min threshold.',focus:ph[3]+'.',cues:['Long pressure','Control rate','Move together'],success:'Pressure increases without rushing.',intensity:'RPE 6–8'};return{lesson:ph[3],workout:'3 × 15 min @ 18–22 with technical focus; 3 min paddle.',fallback:'3 × 15 min erg @ 18–22; 3 min easy.',focus:ph[3]+'.',cues:['Length','Ratio','Quiet recovery'],success:'Repeatable strokes at the assigned rate.',intensity:'RPE 5–6'}}function plans(){let a=[],d=new Date('2026-09-01T12:00:00');for(;d<=new Date('2026-11-12T12:00:00');d.setDate(d.getDate()+1)){let k=d.toISOString().slice(0,10),dow=d.getDay();if((dow===0||dow===6)&&!SPECIAL[k])continue;a.push([k,SPECIAL[k]||generic(k,dow)])}return a}const PLANS=plans();function nextPlan(){let k=localISO();return PLANS.find(x=>x[0]>=k)||PLANS[PLANS.length-1]}async function weather(){let c=document.querySelector('.weather');if(!c)return;try{let w=await fetch('https://api.open-meteo.com/v1/forecast?latitude=40.9465&longitude=-73.0693&current=temperature_2m,wind_speed_10m,wind_gusts_10m,wind_direction_10m&wind_speed_unit=kn&temperature_unit=fahrenheit&timezone=America%2FNew_York').then(r=>r.json()),q=w.current||{},water=null;try{let j=await fetch('https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=water_temperature&application=sbu_crew_coach&date=latest&station=8467150&time_zone=lst_ldt&units=english&format=json').then(r=>r.json());water=Number(j?.data?.[0]?.v)}catch(e){}let wind=Number(q.wind_speed_10m),gust=Number(q.wind_gusts_10m),air=Number(q.temperature_2m),dr=dir(Number(q.wind_direction_10m)),lim=LIMITS[dr]||15,state='go',label='WATER PRACTICE';if(![wind,gust,air].every(Number.isFinite)){state='';label='COACH REVIEW REQUIRED'}else if(wind>lim||gust>lim+7||(Number.isFinite(water)&&(water<40||air+water<90))){state='land';label='LAND PRACTICE'}c.className='card weather '+state;wxstatus.textContent=label;windEl.textContent=(Number.isFinite(wind)?Math.round(wind):'—')+' kt '+dr;gustEl.textContent=(Number.isFinite(gust)?Math.round(gust):'—')+' kt';airEl.textContent=(Number.isFinite(air)?Math.round(air):'—')+'°';waterEl.textContent=(Number.isFinite(water)?Math.round(water):'—')+'°';wxnote.textContent='Limit '+lim+' kt '+dr+' · gust '+(lim+7)+' kt'}catch(e){wxstatus.textContent='COACH REVIEW REQUIRED';wxnote.textContent='Weather data unavailable.'}}function cardTrack(p){return p.novice?`<div class="split"><div class="track"><strong>NOVICE</strong><p>${p.novice}</p></div><div class="track"><strong>VARSITY</strong><p>${p.varsity}</p></div></div>`:`<div class="section"><h3>WORKOUT</h3><p>${p.workout||''}</p></div>${p.fallback?`<div class="section"><h3>LAND FALLBACK</h3><p>${p.fallback}</p></div>`:''}`}function todayHTML(){let [d,p]=nextPlan();return `<div class="card weather"><button class="refresh" onclick="weather()">↻</button><div class="ey">PORT JEFFERSON HARBOR</div><div id="wxstatus" class="status">CHECKING…</div><div class="metrics"><div class="metric"><b id="windEl">—</b><span>WIND</span></div><div class="metric"><b id="gustEl">—</b><span>GUST</span></div><div class="metric"><b id="airEl">—</b><span>AIR</span></div><div class="metric"><b id="waterEl">—</b><span>WATER</span></div></div><div id="wxnote" class="notice">Loading…</div></div><div class="card"><div class="ey">${d}</div><div class="title">${p.lesson}</div><span class="pill">${phase(d)[2]}</span>${cardTrack(p)}<div class="section"><h3>FOCUS</h3><p>${p.focus}</p></div><div class="section"><h3>CUES</h3><div class="chips">${p.cues.map(x=>`<span class="chip">${x}</span>`).join('')}</div></div><div class="section"><h3>SUCCESS</h3><p>${p.success}</p></div><details class="section"><summary class="more">MORE DETAILS</summary><div class="section"><h3>INTENSITY</h3><p>${p.intensity}</p></div><div class="section"><h3>TIME</h3><p>Water 5:15–7:00 · Land 6:00–7:30</p></div></details></div>`}function seasonHTML(){return `<div class="card"><div class="title">Fall 2026</div><p>Sep 1 → Nov 12</p></div>`+PH.map(w=>`<div class="card week"><div class="date">${w[0]} → ${w[1]}</div><h2>${w[2]}</h2><div>${w[3]}</div>${Object.entries(EVENTS).filter(e=>e[0]>=w[0]&&e[0]<=w[1]).map(e=>`<div class="event">${e[0]} · ${e[1]}</div>`).join('')}</div>`).join('')}function planHTML(){return `<div class="card"><div class="title">Daily Plan</div>`+PLANS.map(([d,p])=>`<details class="planrow"><summary><b>${d} · ${p.lesson}</b><small>${phase(d)[2]}</small></summary>${cardTrack(p)}<div class="section"><h3>FOCUS</h3><p>${p.focus}</p></div></details>`).join('')+`</div>`}function libraryHTML(){return `<div class="card"><div class="title">Coach Library</div><div class="section"><h3>FRIDAY</h3><p>Stadium steps · scavenger hunt · outdoor conditioning · recovery.</p></div><div class="section"><h3>DRILLS</h3><p>Body-over pause · reverse pick · legs-only to full stroke · square blade · rate ladders.</p></div><div class="section"><h3>RACE CHECKLIST</h3><p>Lineups · riggers · oars · cox boxes · tools · bow numbers · slings · first aid · lights · paperwork · tie-downs.</p></div></div>`}const EDITKEY='sbu-crew-coach-edits';let edits=JSON.parse(localStorage.getItem(EDITKEY)||'{}');Object.entries(edits).forEach(([k,v])=>{if(SPECIAL[k])Object.assign(SPECIAL[k],v)});document.getElementById('editBtn').onclick=()=>{let [d,p]=nextPlan(),v={lesson:prompt('Lesson',p.lesson)||p.lesson,workout:prompt('Workout',p.workout||'')||p.workout,focus:prompt('Focus',p.focus||'')||p.focus,success:prompt('Success',p.success||'')||p.success};edits[d]=v;localStorage.setItem(EDITKEY,JSON.stringify(edits));Object.assign(SPECIAL[d],v);today.innerHTML=todayHTML();weather();};today.innerHTML=todayHTML();season.innerHTML=seasonHTML();plan.innerHTML=planHTML();library.innerHTML=libraryHTML();weather();document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));document.getElementById(b.dataset.tab).classList.remove('hidden');if(b.dataset.tab==='today')weather()});</script></body></html>
