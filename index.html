<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#79001a"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.json"><title>Coach App · Stony Brook Crew</title>
<style>
:root{--red:#79001a;--ink:#18232a;--muted:#6e7780;--paper:#f3f4f2;--line:#dddfe0;--green:#176b47;--gold:#aa8138}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:78px}header{background:#fff;border-bottom:1px solid var(--line);padding:14px max(16px,calc((100% - 760px)/2));display:flex;align-items:center;gap:11px}.logo{width:44px;height:44px;border-radius:11px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900}.brand h1{font-size:18px;margin:0}.brand p{color:var(--muted);font-size:13px;margin:2px 0}.edit{margin-left:auto;border:0;border-radius:99px;background:var(--red);color:#fff;width:38px;height:38px;font-size:20px}.wrap{max-width:760px;margin:auto;padding:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px}.weather{color:#fff;background:var(--gold);border:0}.weather.go{background:var(--green)}.weather.land{background:#a51c2d}.ey{font-size:11px;letter-spacing:.1em;font-weight:800;opacity:.8}.status{font-size:26px;font-weight:850;margin:4px 0 12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.metric{background:#fff2;border-radius:10px;padding:8px 3px;text-align:center}.metric b{display:block;font-size:18px}.metric span{font-size:10px}.title{font-size:25px;font-weight:850;margin:3px 0 10px}.pill{display:inline-block;background:#f1f2f3;border-radius:99px;padding:6px 9px;color:#4b5563;font-size:12px;font-weight:750}.section{border-top:1px solid #eee;padding-top:11px;margin-top:11px}.section h3{font-size:11px;color:var(--muted);letter-spacing:.1em;margin:0 0 5px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#f5e7eb;color:var(--red);border-radius:99px;padding:6px 9px;font-size:12px;font-weight:750}.resource{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:13px;padding:14px;margin-top:9px;background:#fff}.resource strong{display:block}.resource span{display:block;color:var(--muted);font-size:13px;margin-top:3px}.resource i{float:right;color:var(--red);font-style:normal;font-weight:900}.note{width:100%;min-height:88px;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;resize:vertical}.save{border:0;border-radius:10px;padding:10px 14px;background:var(--red);color:#fff;font-weight:800;margin-top:8px}.small{color:var(--muted);font-size:13px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:3}nav button{width:20%;max-width:150px;border:0;background:#fff;color:var(--muted);padding:8px 2px;font-size:12px}nav button.active{color:var(--red);font-weight:800}nav b{font-size:18px;display:block}@media(max-width:420px){.metrics{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><header><div class="logo">SBU</div><div class="brand"><h1>CREW COACH</h1><p>Port Jefferson Harbor · Fall 2026</p></div><button class="edit" aria-label="Edit today's workout">✎</button></header><main class="wrap" id="view"></main><nav aria-label="Coach app"><button class="active" data-v="today"><b>☁</b>Today</button><button data-v="tomorrow"><b>→</b>Tomorrow</button><button data-v="season"><b>▣</b>Season</button><button data-v="plan"><b>☷</b>Plan</button><button data-v="resources"><b>↗</b>Resources</button></nav>
<script>
const PUBLIC='https://www.rtpny.com',MANIFEST=PUBLIC+'/content.json',PLAN='/training-plan.json';
let plans=[['2026-09-01','Rowing 101 / Varsity Circuit','Erg setup, posture, sequence. Varsity: 25 min steady @ 18–20 + bodyweight/core.','Novices learn sequence; varsity completes quality work.'],['2026-09-02','Recovery Order / Varsity Circuit','Hands away → body over → slide. Varsity: 3 × 8 min @ 18–20.','Patient recovery and consistent rhythm.'],['2026-09-03','Connection / Varsity Circuit','Full stroke review, legs-first connection, then 3 × 5 min @ 18.','Connect the drive without rushing.'],['2026-09-04','Friday Team Day','Stadium steps or outdoor team challenge. No ergs.','Conditioning and team cohesion.'],['2026-09-17','2K #1','Standard warm-up, then 2K. Record each 500 split.','Establish an honest baseline.'],['2026-09-18','Rigging Day','Rig boats. Teach parts, hardware, care and ownership.','Make the fleet ready.'],['2026-09-21','Commands & Safety','Carrying, commands, launch sequence, stopping, turning and emergency basics.','Operate safely before rowing.'],['2026-09-22','First Water Practice','Set work, arms/body sequencing, pause work, short rowing @ 16–18.','Make the boat stable.'],['2026-10-24','Head of the Fish','Race day. Standard warm-up, 4K race plan, cooldown.','Execute the 4K.'],['2026-10-29','2K #2','Same warm-up as Sept. 17, then 2K. Record each 500 split.','Measure fall progress.'],['2026-11-07','Frostbite','Race day. Start-settle, base rhythm, attack third 500.','Execute the 2K plan.'],['2026-11-12','Final Practice','Light technical row if safe; otherwise easy movement + season review.','Close the fall intentionally.']];
const fallback=[['New Rower & Athlete Guide','First days, preparation, commands, expectations','athletes'],['Coaching Resources','Sequence, posture, recovery, connection, benchmarks','coaching'],['Regatta Hub','Race-day, travel, equipment, and family logistics','regattas'],['Parent Guide','What to expect, costs, forms, and support','parents'],['Safety & Equipment','Team movement, commands, fleet care, and readiness','safety'],['About the Program','Recruiting, alumni, leadership, and support','about']];
let manifest={resources:fallback.map(x=>({title:x[0],summary:x[1],path:'#'+x[2]}))},active='today';
function current(){let d=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York'}).format(new Date());return plans.find(x=>x[0]>=d)||plans[0]}
function notes(){return localStorage.getItem('sbu-crew-coach-notes')||''}
function card(p){return '<section class="card"><div class="ey">'+p[0]+'</div><div class="title">'+p[1]+'</div><span class="pill">Fall 2026</span><div class="section"><h3>WORKOUT</h3><p>'+p[2]+'</p></div><div class="section"><h3>FOCUS</h3><p>'+p[3]+'</p></div><div class="section"><h3>CUES</h3><div class="chips"><span class="chip">Move together</span><span class="chip">Long strokes</span><span class="chip">Trust the plan</span></div></div><div class="section"><h3>COACH NOTES</h3><textarea class="note" id="notes" placeholder="Capture the adjustment you want to carry forward…">'+notes()+'</textarea><button class="save" id="save">Save note</button></div></section>'}
function render(v=active){active=v;let i=plans.findIndex(x=>x[0]===current()[0]),p=v==='tomorrow'?plans[Math.min(i+1,plans.length-1)]:current(),h=v==='today'||v==='tomorrow'?card(p):v==='season'?'<section class="card"><div class="title">Fall 2026</div><p>Training progression and confirmed events. Historical material is context, not a current requirement.</p></section>'+plans.map(x=>'<section class="card"><div class="ey">'+x[0]+'</div><div class="title" style="font-size:20px">'+x[1]+'</div><p class="small">'+x[3]+'</p></section>').join(''):v==='plan'?'<section class="card"><div class="title">Daily Plan</div>'+plans.map(x=>'<details class="section"><summary><b>'+x[0]+' · '+x[1]+'</b></summary><p>'+x[2]+'</p><small>'+x[3]+'</small></details>').join('')+'</section>':'<section class="card"><div class="ey">LIVE FROM RTPNY.COM</div><div class="title">Resources</div><p>Curated public guidance for athletes, families, and coaches. The Coach App and public site now use the same resource index.</p>'+manifest.resources.map(x=>'<a class="resource" href="'+(x.href||((x.path||'').startsWith('http')?x.path:PUBLIC+'/'+(x.path||'')))+'" target="_blank" rel="noopener"><i>↗</i><strong>'+x.title+'</strong><span>'+x.summary+'</span></a>').join('')+'</section>';document.getElementById('view').innerHTML=h;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));let s=document.getElementById('save');if(s)s.onclick=()=>{localStorage.setItem('sbu-crew-coach-notes',document.getElementById('notes').value);s.textContent='Saved';setTimeout(()=>s.textContent='Save note',1200)};if(v==='today'||v==='tomorrow')weather(v)}
async function weather(v){try{let q=(await fetch('https://api.open-meteo.com/v1/forecast?latitude=40.9465&longitude=-73.0693&current=temperature_2m,wind_speed_10m,wind_gusts_10m,wind_direction_10m&wind_speed_unit=kn&temperature_unit=fahrenheit&timezone=America%2FNew_York').then(r=>r.json())).current,d=['N','NE','E','SE','S','SW','W','NW'][Math.round(q.wind_direction_10m/45)%8],lim={E:15,W:15,S:20,N:10,NE:10,NW:15,SE:15,SW:15}[d]||15,e=document.createElement('section');e.className='card weather '+(q.wind_speed_10m>lim||q.wind_gusts_10m>lim+7?'land':'go');e.innerHTML='<div class="ey">PORT JEFFERSON HARBOR · '+(v==='today'?'TODAY':'TOMORROW')+'</div><div class="status">'+(q.wind_speed_10m>lim||q.wind_gusts_10m>lim+7?'LAND PRACTICE':'WATER PRACTICE')+'</div><div class="metrics"><div class="metric"><b>'+Math.round(q.wind_speed_10m)+' kt</b><span>WIND</span></div><div class="metric"><b>'+Math.round(q.wind_gusts_10m)+' kt</b><span>GUST</span></div><div class="metric"><b>'+Math.round(q.temperature_2m)+'°</b><span>AIR</span></div><div class="metric"><b>'+d+'</b><span>DIRECTION</span></div></div>';document.getElementById('view').prepend(e)}catch(e){}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>render(b.dataset.v));document.querySelector('.edit').onclick=()=>{render('today');document.getElementById('notes')?.focus()};render();fetch(MANIFEST).then(r=>r.json()).then(x=>{if(x.resources?.length){manifest=x;render(active)}}).catch(()=>{});fetch(PLAN).then(r=>r.json()).then(x=>{if(x.sessions?.length){plans=x.sessions.map(s=>[s.date,s.title,s.workout+' '+s.land,s.intent]);render(active)}}).catch(()=>{});if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
