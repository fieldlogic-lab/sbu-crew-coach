<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c2333"><title>Crew Coach</title>
<style>
:root{--ink:#102a3a;--muted:#607586;--line:#dbe5ea;--paper:#f6f8f7;--card:#fff;--teal:#087f83;--gold:#e8b84d;--danger:#a24736}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}header{background:var(--ink);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;position:sticky;top:0;z-index:5}h1,h2,h3,p{margin:0}h1{font-size:25px;letter-spacing:-.03em}.sub{color:#b8ccd3;font-size:13px;margin-top:2px}.wrap{max-width:720px;margin:auto;padding:16px 14px 88px}.tabs{display:flex;gap:7px;margin:0 0 16px;overflow:auto}.tabs button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 14px;font-weight:700;white-space:nowrap}.tabs button.active{background:var(--teal);border-color:var(--teal);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0d2c3b0a}.eyebrow{color:var(--teal);text-transform:uppercase;font-size:11px;font-weight:800;letter-spacing:.1em}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field.full{grid-column:1/-1}label{font-weight:750;font-size:13px;color:var(--muted)}input,textarea,select{font:inherit;border:1px solid #cbd9df;border-radius:10px;padding:10px;background:#fff;color:var(--ink);width:100%}textarea{min-height:74px;resize:vertical}.track{border-left:4px solid var(--gold);padding-left:12px;margin-top:14px}.track.v{border-color:var(--teal)}.track h3{font-size:14px}.pill{display:inline-block;border-radius:99px;background:#e9f4f2;color:var(--teal);padding:4px 8px;font-size:12px;font-weight:800}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{cursor:pointer;border:0;border-radius:10px;padding:10px 13px;background:var(--teal);color:#fff;font-weight:750}button.secondary{background:#e9f0f2;color:var(--ink)}button.danger{background:#f5e5e1;color:var(--danger)}.daylist{display:grid;gap:8px}.day{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;width:100%;color:var(--ink)}.day small{display:block;color:var(--muted)}.notice{padding:11px 12px;border-radius:10px;background:#fff6dc;color:#715313;font-size:14px}.hidden{display:none!important}@media(max-width:520px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body><header><h1>⚓ Crew Coach</h1><div class="sub">SBU rowing • Fall training plan</div></header><main class="wrap"><nav class="tabs"><button data-tab="today">Today</button><button data-tab="plan">Plan</button><button data-tab="data">Edit / Data</button></nav><section id="today"></section><section id="plan" class="hidden"></section><section id="data" class="hidden"></section></main>
<script>
const KEY='sbu-crew-coach-plan-v2'; const dates=[]; for(let d=new Date('2026-09-01T12:00:00');dates.length<57;d.setDate(d.getDate()+1)){if(d.getDay()!==0&&d.getDay()!==6||['2026-10-03','2026-10-24','2026-11-07','2026-11-08'].includes(d.toISOString().slice(0,10)))dates.push(d.toISOString().slice(0,10))}
const seed=(date,i)=>({date,lesson:i<3?['Rowing 101 & erg setup','Connection: hands → body → slide','Legs-first drive + controlled pieces'][i]:'Season practice plan',workout:i<3?['Short coached repetitions','Pause work + low-rate pieces','3 × 5 min controlled workout'][i]:'Technique and aerobic development',fallback:'Land circuit: mobility, core, and bodyweight strength',focus:i<3?['Posture, sequence, and confidence','Relaxed recovery and rhythm','Connection through the legs'][i]:'Technical consistency under pressure',cues:'Tall posture • quiet hands • steady rhythm',success:'Athletes can explain the goal and complete the work with control',intensity:i<3?['Easy / instructional','Easy / technical','Moderate'][i]:'Moderate',novice:i<3?['Learn the erg and stroke sequence','Recovery sequence and pause work','First controlled 3 × 5 min'][i]:'Follow the coached progression',varsity:i<3?['25-min aerobic erg + 25-min bodyweight/core circuit','3 × 8 min @ 18–20 + non-erg station','4 × 6 min @ 20, final 90 sec firm + non-erg station'][i]:'Aerobic erg or water workout; self-manage the circuit',notes:''});
let plan=JSON.parse(localStorage.getItem(KEY)||'null')||dates.map(seed); let selected=plan.findIndex(x=>x.date===new Date().toISOString().slice(0,10)); if(selected<0)selected=0;
function save(){localStorage.setItem(KEY,JSON.stringify(plan)); toast('Saved on this device'); renderToday();} function toast(s){let n=document.createElement('div');n.textContent=s;n.style='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#102a3a;color:white;padding:10px 15px;border-radius:99px;z-index:20';document.body.append(n);setTimeout(()=>n.remove(),1600)}
function field(k,label,wide=false){return `<div class="field ${wide?'full':''}"><label>${label}</label><textarea data-key="${k}">${esc(plan[selected][k]||'')}</textarea></div>`} function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))} function pretty(d){return new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}
function renderToday(){let x=plan[selected];document.querySelector('#today').innerHTML=`<div class="card"><div class="eyebrow">${pretty(x.date)} • ${x.intensity}</div><h2>${esc(x.lesson)}</h2><p class="muted" style="margin-top:5px">${esc(x.focus)}</p><div class="track"><h3>NOVICE TRACK</h3><p>${esc(x.novice)}</p></div><div class="track v"><h3>VARSITY TRACK</h3><p>${esc(x.varsity)}</p></div></div><div class="card"><div class="eyebrow">Coach card</div><p><b>Workout:</b> ${esc(x.workout)}</p><p><b>Fallback:</b> ${esc(x.fallback)}</p><p><b>Cues:</b> ${esc(x.cues)}</p><p><b>Success:</b> ${esc(x.success)}</p>${x.notes?`<p style="margin-top:10px"><b>Coach notes:</b> ${esc(x.notes)}</p>`:''}</div><div class="notice">Edits save immediately on this device. Use Edit / Data to update tomorrow or next year's plan.</div>`}
function renderPlan(){document.querySelector('#plan').innerHTML=`<div class="card"><div class="row"><div><div class="eyebrow">Season plan</div><h2>Choose a day</h2></div><span class="pill">${plan.length} days</span></div><div class="daylist" style="margin-top:12px">${plan.map((x,i)=>`<button class="day" data-day="${i}"><span><b>${pretty(x.date)}</b><small>${esc(x.lesson)}</small></span><span>›</span></button>`).join('')}</div></div>`;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=+b.dataset.day;show('data')})}
function renderData(){let x=plan[selected];document.querySelector('#data').innerHTML=`<div class="card"><div class="row"><div><div class="eyebrow">Edit / Data</div><h2>${pretty(x.date)}</h2></div><select id="daySelect">${plan.map((d,i)=>`<option value="${i}" ${i===selected?'selected':''}>${pretty(d.date)}</option>`).join('')}</select></div><div class="grid">${field('lesson','Lesson',true)}${field('workout','Workout')}${field('fallback','Land fallback')}${field('focus','Focus')}${field('cues','Technical cues')}${field('success','Success standard')}${field('intensity','Intensity')}${field('novice','Novice track',true)}${field('varsity','Varsity track',true)}${field('notes','Freeform coach notes',true)}</div><div class="actions"><button id="save">Save now</button><button class="secondary" id="copy">Copy this day to…</button><button class="secondary" id="default">Save as default for next year</button></div></div><div class="card"><div class="eyebrow">Backup</div><h3>Move your plan between devices</h3><p class="muted">Export a JSON backup regularly. Importing replaces the current local plan.</p><div class="actions"><button id="export">Export JSON</button><button class="secondary" id="import">Import JSON</button><input id="file" type="file" accept="application/json" class="hidden"></div></div>`;document.querySelector('#daySelect').onchange=e=>{selected=+e.target.value;renderData()};document.querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{plan[selected][el.dataset.key]=el.value;localStorage.setItem(KEY,JSON.stringify(plan))});document.querySelector('#save').onclick=save;document.querySelector('#copy').onclick=()=>{let to=prompt('Copy to which date? (YYYY-MM-DD)');let target=plan.findIndex(x=>x.date===to);if(target>=0){plan[target]={...plan[selected],date:to};save();renderData()}else toast('Date not found')};document.querySelector('#default').onclick=()=>{localStorage.setItem('sbu-crew-coach-default',JSON.stringify(plan[selected]));toast('Day saved as next-year default')};document.querySelector('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'SBU Crew Coach',version:2,plan},null,2)],{type:'application/json'}));a.download='sbu-crew-coach-backup.json';a.click()};document.querySelector('#import').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=e=>{let r=new FileReader();r.onload=()=>{try{let j=JSON.parse(r.result);if(!Array.isArray(j.plan))throw 0;plan=j.plan;selected=0;save();renderData();renderPlan()}catch{toast('That backup could not be read')}};r.readAsText(e.target.files[0])}}
function show(id){document.querySelectorAll('section').forEach(s=>s.classList.toggle('hidden',s.id!==id));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));if(id==='today')renderToday();if(id==='plan')renderPlan();if(id==='data')renderData()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));show('today');
</script></body></html>
